# Included only in Nginx Proxy Manager's http context.
# Install certificates under /data/custom_ssl/agromind/ before activating.
server {
  listen 80;
  listen [::]:80;
  server_name agromind.ericksaymon.dev;
  return 301 https://agromind.ericksaymon.dev$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name agromind.ericksaymon.dev;
  ssl_certificate /data/custom_ssl/agromind/origin.crt;
  ssl_certificate_key /data/custom_ssl/agromind/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /data/nginx/custom/agromind-cloudflare-realip.conf;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  resolver 127.0.0.11 valid=30s;
  set $agromind_web http://agromind-web:3000;
  set $agromind_api http://agromind-api:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Connection "";
  proxy_read_timeout 90s;
  location /api/ {
    proxy_pass $agromind_api;
    add_header Cache-Control "no-store" always;
  }
  location / {
    proxy_pass $agromind_web;
    proxy_buffering off;
  }
}
